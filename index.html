<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 🎂</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e2de2);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: white;
    }

    .container {
      width: 90%;
      max-width: 650px;
      text-align: center;
      padding: 35px 25px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 25px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      position: relative;
      z-index: 2;
    }

    .cake {
      font-size: 80px;
      animation: bounce 1.5s infinite;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(2.5rem, 10vw, 5rem);
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(255,255,255,0.7);
      animation: glow 2s infinite alternate;
    }

    h2 {
      font-size: clamp(1.5rem, 6vw, 2.5rem);
      margin-bottom: 20px;
    }

    p {
      font-size: clamp(1rem, 4vw, 1.3rem);
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .wish {
      font-weight: bold;
      font-size: 1.15rem;
    }

    button {
      border: none;
      padding: 14px 28px;
      border-radius: 50px;
      background: white;
      color: #d63384;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 10px 30px rgba(255,255,255,0.4);
    }

    .balloon {
      position: absolute;
      font-size: 45px;
      animation: float 4s ease-in-out infinite;
      z-index: 1;
    }

    .b1 { left: 5%; top: 10%; }
    .b2 { right: 5%; top: 15%; animation-delay: 1s; }
    .b3 { left: 8%; bottom: 10%; animation-delay: 2s; }
    .b4 { right: 8%; bottom: 8%; animation-delay: 1.5s; }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 18px;
      top: -30px;
      z-index: 10;
      animation: fall linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      0% {
        transform: translateY(-30px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px white;
      }

      to {
        text-shadow:
          0 0 20px white,
          0 0 40px #ffddff;
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(-5deg);
      }

      50% {
        transform: translateY(-25px) rotate(5deg);
      }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .container {
        padding: 30px 18px;
      }

      .cake {
        font-size: 65px;
      }

      p {
        line-height: 1.6;
      }

      .balloon {
        font-size: 35px;
      }
    }
  </style>
</head>

<body>

  <!-- Decorative Balloons -->
  <div class="balloon b1">🎈</div>
  <div class="balloon b2">🎈</div>
  <div class="balloon b3">🎈</div>
  <div class="balloon b4">🎈</div>

  <!-- Main Birthday Card -->
  <div class="container">

    <div class="cake">🎂</div>

    <h1>Happy Birthday!</h1>

    <h2>🥳 Wishing You a Wonderful Day! 🎉</h2>

    <p class="wish">
      May your birthday be filled with happiness, laughter,
      beautiful memories and lots of love. 💖
    </p>

    <p>
      May all your dreams come true and may the coming year
      bring you success, peace and endless reasons to smile! ✨
    </p>

    <button onclick="celebrate()">
      🎉 Celebrate Again 🎉
    </button>

  </div>

  <script>
    function createConfetti() {
      const confetti = document.createElement("div");
      confetti.classList.add("confetti");

      const colors = [
        "#ff4d6d",
        "#ffd166",
        "#06d6a0",
        "#4cc9f0",
        "#ffffff",
        "#c77dff"
      ];

      confetti.style.left = Math.random() * 100 + "vw";
      confetti.style.backgroundColor =
        colors[Math.floor(Math.random() * colors.length)];

      confetti.style.width =
        Math.random() * 8 + 6 + "px";

      confetti.style.height =
        Math.random() * 12 + 8 + "px";

      confetti.style.animationDuration =
        Math.random() * 3 + 3 + "s";

      confetti.style.transform =
        `rotate(${Math.random() * 360}deg)`;

      document.body.appendChild(confetti);

      setTimeout(() => {
        confetti.remove();
      }, 6000);
    }

    function celebrate() {
      // Big burst
      for (let i = 0; i < 120; i++) {
        setTimeout(() => {
          createConfetti();
        }, i * 15);
      }
    }

    // Automatic celebration when page opens
    window.onload = () => {
      celebrate();
    };
  </script>

</body>
</html>
